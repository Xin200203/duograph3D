<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
<style>
    .title { font: 700 26px sans-serif; fill: #111; }
    .subtitle { font: 500 18px sans-serif; fill: #222; }
    .body { font: 400 16px sans-serif; fill: #222; }
    .small { font: 400 14px sans-serif; fill: #333; }
    .box { fill: #f7f9fc; stroke: #2c3e50; stroke-width: 2; rx: 12; ry: 12; }
    .accent { fill: #eaf2ff; stroke: #356ae6; stroke-width: 2; rx: 12; ry: 12; }
    .danger { fill: #fff0f0; stroke: #c0392b; stroke-width: 2; rx: 12; ry: 12; }
    .arrow { stroke: #34495e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
  </marker>
</defs>
<text class="title" x="40" y="60">Figure 3. Layer-2 current-to-memory association</text>
<text class="body" x="40" y="95">Temporal identity cues and geometry-profile consistency jointly constrain identity updates, with graph-memory relation bonuses.</text>
<rect class="accent" x="60" y="150" width="240" height="180"/>
<text class="subtitle" x="78" y="180">Current hypotheses</text>
<text class="small" x="78" y="210">descriptor</text>
<text class="small" x="78" y="230">track hint</text>
<text class="small" x="78" y="250">support signals</text>
<text class="small" x="78" y="270">repair reasons</text>
<rect class="accent" x="360" y="110" width="320" height="260"/>
<text class="subtitle" x="378" y="140">Association score</text>
<text class="small" x="378" y="170">descriptor / appearance</text>
<text class="small" x="378" y="190">continuity key</text>
<text class="small" x="378" y="210">geometry-profile consistency</text>
<text class="small" x="378" y="230">relation bonus</text>
<rect class="danger" x="740" y="110" width="240" height="260"/>
<text class="subtitle" x="758" y="140">Dual-consistency gate</text>
<text class="small" x="758" y="170">continuity alone is</text>
<text class="small" x="758" y="190">insufficient when</text>
<text class="small" x="758" y="210">geometry collapses</text>
<rect class="accent" x="1040" y="150" width="220" height="180"/>
<text class="subtitle" x="1058" y="180">Memory update</text>
<text class="small" x="1058" y="210">birth / associate / reentry</text>
<text class="small" x="1058" y="230">status update</text>
<text class="small" x="1058" y="250">relation-edge update</text>
<path class="arrow" d="M300 240 L360 240"/>
<path class="arrow" d="M680 240 L740 240"/>
<path class="arrow" d="M980 240 L1040 240"/>
<rect class="box" x="360" y="430" width="520" height="180"/>
<text class="subtitle" x="378" y="460">Why it matters</text>
<text class="small" x="378" y="490">Prevents temporal continuity from carrying identity alone.</text>
<text class="small" x="378" y="510">Lets relation edges influence later association decisions.</text></svg>

<text class="small" x="338" y="220">Support signals preserved</text>
<text class="small" x="338" y="240">Temporal variants available</text>
<rect class="accent" x="600" y="110" width="260" height="220"/>
<text class="subtitle" x="618" y="140">Layer-1 repair</text>
<text class="small" x="618" y="170">Compatibility graph</text>
<text class="small" x="618" y="190">Continuity / appearance /</text>

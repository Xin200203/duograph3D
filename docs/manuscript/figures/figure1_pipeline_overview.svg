<rect class="accent" x="1240" y="110" width="120" height="220"/>
<text class="subtitle" x="1258" y="140">Graph memory</text>
<text class="small" x="1258" y="170">node state</text>
<text class="small" x="1258" y="190">lifecycle</text>

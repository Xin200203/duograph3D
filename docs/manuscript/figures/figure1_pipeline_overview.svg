<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<style>
    .title { font: 700 26px sans-serif; fill: #111; }
    .subtitle { font: 500 18px sans-serif; fill: #222; }
    .body { font: 400 16px sans-serif; fill: #222; }
    .small { font: 400 14px sans-serif; fill: #333; }
    .box { fill: #f7f9fc; stroke: #2c3e50; stroke-width: 2; rx: 12; ry: 12; }
    .accent { fill: #eaf2ff; stroke: #356ae6; stroke-width: 2; rx: 12; ry: 12; }
    .danger { fill: #fff0f0; stroke: #c0392b; stroke-width: 2; rx: 12; ry: 12; }
    .arrow { stroke: #34495e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
  </marker>
</defs>
<text class="title" x="40" y="60">Figure 1. DuoGraph3D overall pipeline</text>
<text class="body" x="40" y="95">Real observations flow through evidence repair, association, graph-memory updates, and manuscript-facing analysis assets.</text>
<rect class="accent" x="40" y="140" width="220" height="160"/>
<text class="subtitle" x="58" y="170">Real observations</text>
<text class="small" x="58" y="200">Replica: DEVA JSON</text>
<text class="small" x="58" y="220">ScanNet: ESAM monitor</text>
